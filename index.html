<style>
  :root {

    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2481cc);

    --card: var(--tg-theme-section-bg-color, var(--bg));
    --sep: color-mix(in srgb, var(--hint) 25%, transparent);
    --ok: #2e9e5b;
    --warn: #d9822b;
    --bad: #d64545;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg2);

  header h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
  header .sub { color: var(--hint); font-size: 13px; margin-top: 1px; }
  .langs { display: flex; background: var(--card); border-radius: 10px; padding: 3px; gap: 2px; }
  .langs button { border: 0; background: transparent; color: var(--hint); font-weight: 600;
    font-size: 13px; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .langs button.on { background: var(--btn); color: var(--btn-text); }
  main { padding: 4px 16px 16px; }
  section.tab { display: none; }
  section.tab.on { display: block; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .muted { color: var(--hint); font-size: 13px; }
  .group-title { color: var(--hint); font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px; margin: 16px 4px 8px; }
  /* catalog */
  .visa { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .visa .ico { font-size: 26px; width: 40px; height: 40px; display: grid; place-items: center;
    background: var(--bg2); border-radius: 12px; flex: none; }
  .visa .t { font-weight: 600; }
  .visa .d { color: var(--hint); font-size: 13px; }
  .visa .chev { margin-left: auto; color: var(--hint); transition: transform .2s; flex: none; }
  .visa.open .chev { transform: rotate(90deg); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    background: color-mix(in srgb, var(--btn) 15%, transparent); color: var(--btn); margin-left: 6px; vertical-align: 1px; }
  .details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--sep); }
  .card.open .details { display: block; }
  .details h4 { margin: 10px 0 4px; font-size: 13px; color: var(--hint); font-weight: 600; }
  .details h4:first-child { margin-top: 0; }
  .details ul { margin: 0; padding-left: 18px; }
  .details li { margin: 3px 0; }
  .price { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 10px;
    padding: 10px 12px; background: var(--bg2); border-radius: 10px; }
  .price b { font-size: 16px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; font-size: 15px;

  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--btn); }
  /* forms */
  .q { margin-bottom: 14px; }
  .q:last-child { margin-bottom: 0; }
  .q label.ql { display: block; font-weight: 600; margin-bottom: 7px; }
  .q .help { color: var(--hint); font-size: 12.5px; margin: -4px 0 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1.5px solid var(--sep); background: var(--bg); color: var(--text); border-radius: 20px;
    padding: 7px 12px; font-size: 14px; cursor: pointer; }
  .chip.on { border-color: var(--btn); background: color-mix(in srgb, var(--btn) 12%, var(--bg)); color: var(--btn); font-weight: 600; }
  .chips.col { flex-direction: column; }
  .chips.col .chip { border-radius: 12px; text-align: left; }
  input.in { width: 100%; border: 1.5px solid var(--sep); background: var(--bg); color: var(--text);
    border-radius: 12px; padding: 11px 12px; font-size: 15px; outline: none; }
  input.in:focus { border-color: var(--btn); }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--sep); cursor: pointer; }
  .check:first-of-type { border-top: 0; }
  .check input { width: 20px; height: 20px; accent-color: var(--btn); flex: none; margin-top: 1px; }
  .check .pts { margin-left: auto; color: var(--hint); font-size: 13px; white-space: nowrap; }

  .result { text-align: center; }
  .score { font-size: 44px; font-weight: 800; line-height: 1; margin: 6px 0 2px; }
  .score small { font-size: 18px; color: var(--hint); font-weight: 600; }
  .bar { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .bar i { display: block; height: 100%; background: var(--btn); border-radius: 4px; transition: width .3s; }
  .verdict { font-weight: 600; margin-top: 6px; }
  .verdict.ok { color: var(--ok); } .verdict.warn { color: var(--warn); } .verdict.bad { color: var(--bad); }
  .note { font-size: 12.5px; color: var(--hint); margin-top: 8px; }
  .sticky-res { position: sticky; top: 62px; z-index: 4; }
  /* nav */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--card);
    border-top: 1px solid var(--sep); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; border: 0; background: transparent; color: var(--hint); font-size: 11.5px;

  nav button span { font-size: 21px; line-height: 1.1; filter: grayscale(1); opacity: .7; }
  nav button.on { color: var(--btn); }
  nav button.on span { filter: none; opacity: 1; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 20;

  .toast.on { opacity: 1; transform: none; }
  .search { position: relative; margin: 6px 0 10px; }
  .search input { padding-left: 36px; }
  .search span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--hint); }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 10px; padding: 0 16px; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chips.scroll .chip { white-space: nowrap; }
  .job .t { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .job .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 7px; background: var(--bg2); color: var(--hint); }
  .tag.t-ausbildung { background: color-mix(in srgb, #2e9e5b 14%, transparent); color: #2e9e5b; }
  .tag.t-vollzeit { background: color-mix(in srgb, var(--btn) 14%, transparent); color: var(--btn); }
  .tag.t-saison { background: color-mix(in srgb, #d9822b 16%, transparent); color: #c4721f; }
  .tag.t-teilzeit { background: color-mix(in srgb, #8e5bd6 14%, transparent); color: #8e5bd6; }
  .job .sal { font-weight: 700; margin-top: 6px; }
  .job .date { color: var(--hint); font-size: 12px; margin-top: 4px; }
  .job .desc { white-space: pre-wrap; margin: 10px 0; }
  .job .src { font-size: 13px; color: var(--hint); word-break: break-all; margin-bottom: 10px; }
  .warnbox { font-size: 12.5px; color: var(--hint); background: var(--bg2); border-radius: 10px; padding: 9px 11px; margin-bottom: 10px; }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }
  .err { color: var(--bad); font-size: 13px; margin-top: 6px; display: none; }
</style>
</head>

    <button class="btn" id="ball-send" data-i="ballSend"></button>
    <p class="note" style="margin:10px 4px" data-i="ballNote"></p>
  </section>

  <section class="tab" id="tab-form">
    <div class="card" id="form-body"></div>
    <button class="btn" id="form-send" data-i="formSend"></button>
    <div class="err" id="form-err"></div>
    <p class="note" style="margin:10px 4px" data-i="consent"></p>
  </section>
</main>

/* ---------------- points calculator ---------------- */
function chips(name, items, val, col) {
  return `<div class="chips ${col ? "col" : ""}">${items.map(([v, label]) =>
    `<button class="chip ${val === v ? "on" : ""}" data-k="${name}" data-val="${v}">${esc(label)}</button>`).join("")}</div>`;
}
function calcBall() {
  const p = [];
  if (ball.partial) p.push(["partial", 4]);
  const de = [0, 0, 1, 2, 3][ball.de]; if (de) p.push(["de", de]);
  if (ball.en === 3) p.push(["enC1", 1]);
  const ex = [0, 2, 3][ball.exp]; if (ex) p.push(["exp", ex]);
  if (ball.shortage) p.push(["shortage", 1]);
  const ag = [2, 1, 0][ball.age]; if (ag) p.push(["age", ag]);
  if (ball.stay) p.push(["stay", 1]);
  if (ball.spouse) p.push(["spouse", 1]);
  const points = p.reduce((s, [, n]) => s + n, 0);
  const langOk = ball.de >= 1 || ball.en >= 2;
  let status;
  if (ball.qual === false) status = "noQual";
  else if (ball.full === true) status = "full";
  else if (!langOk) status = "noLang";
  else status = points >= 6 ? "ok" : "need";
  return { points, parts: p, status, langOk };
}
function renderBall() {
  const r = calcBall();
  const cls = { ok: "ok", full: "ok", need: "warn", noQual: "bad", noLang: "bad" }[r.status];
  const verdict = { ok: t("vOk"), full: t("vFull"), need: t("vNeed")(Math.max(0, 6 - r.points)), noQual: t("vNoQual"), noLang: t("vNoLang") }[r.status];
  document.getElementById("ball-result").innerHTML = `
    <div class="score">${r.points} <small>${t("of6")} ${t("pts")}</small></div>
    <div class="bar"><i style="width:${Math.min(100, r.points / 6 * 100)}%"></i></div>
    <div class="verdict ${cls}">${verdict}</div>
    ${r.status === "ok" || r.status === "full" ? `<div class="note">${t("fundsNote")}</div>` : ""}`;

  const yn = [[true, t("yes")], [false, t("no")]];
  document.getElementById("ball-base").innerHTML = `
    <div class="q"><label class="ql">${t("qual")}</label>${chips("qual", yn, ball.qual)}</div>
    <div class="q"><label class="ql">${t("full")}</label><div class="help">${t("fullHelp")}</div>${chips("full", [[true, t("yes")], [false, t("no")], ["dk", t("dk")]], ball.full)}</div>
    <div class="q"><label class="ql">${t("de")}</label>${chips("de", [[0, t("none")], [1, "A1"], [2, "A2"], [3, "B1"], [4, "B2+"]], ball.de)}</div>
    <div class="q"><label class="ql">${t("en")}</label>${chips("en", [[0, t("none")], [1, "A1–B1"], [2, "B2"], [3, "C1+"]], ball.en)}</div>`;

  const ck = (k, label, pts) => `<label class="check"><input type="checkbox" data-ck="${k}" ${ball[k] ? "checked" : ""}><span>${esc(label)}</span><span class="pts">+${pts}</span></label>`;
  document.getElementById("ball-points").innerHTML = `
    <div class="q"><label class="ql">${t("exp")}</label>${chips("exp", [[0, t("exp0")], [1, t("exp2") + " · +2"], [2, t("exp5") + " · +3"]], ball.exp, true)}</div>
    <div class="q"><label class="ql">${t("age")}</label>${chips("age", [[0, t("age0") + " · +2"], [1, t("age1") + " · +1"], [2, t("age2")]], ball.age)}</div>
    ${ck("partial", t("partial"), 4)}
    ${ck("shortage", t("shortage"), 1)}
    ${ck("stay", t("stay"), 1)}
    ${ck("spouse", t("spouse"), 1)}`;
  document.getElementById("ball-send").disabled = ball.qual === null;
}
document.getElementById("tab-ball").addEventListener("click", (e) => {
  const c = e.target.closest(".chip[data-k]");
  if (c) {
    const raw = c.dataset.val;
    ball[c.dataset.k] = raw === "true" ? true : raw === "false" ? false : raw === "dk" ? "dk" : +raw;
    haptic(); renderBall();

document.getElementById("tab-ball").addEventListener("change", (e) => {
  const k = e.target.dataset.ck; if (!k) return;

document.getElementById("ball-send").addEventListener("click", () => {
  const r = calcBall();

    b: { q: ball.qual, f: ball.full, de: ball.de, en: ball.en, pa: ball.partial, ex: ball.exp, sh: ball.shortage, ag: ball.age, st: ball.stay, sp: ball.spouse } });
});

  document.getElementById("form-body").innerHTML = h;
}
document.getElementById("tab-form").addEventListener("click", (e) => {
  const c = e.target.closest(".chip[data-k]");
  if (!c) return;
  const k = c.dataset.k.slice(2);
  form.a[k] = +c.dataset.val;
  if (!needed("english", form.a)) delete form.a.english;
  haptic(); renderForm();
  document.getElementById("form-err").style.display = "none";
});
document.getElementById("tab-form").addEventListener("input", (e) => {
  if (e.target.id === "f-name") form.name = e.target.value;
  if (e.target.id === "f-phone") form.phone = e.target.value;
});
document.getElementById("form-send").addEventListener("click", () => {
  const err = document.getElementById("form-err");
  const missing = !form.name.trim() || STEPS.some(k => needed(k, form.a) && form.a[k] === undefined);
  const digits = form.phone.replace(/\D/g, "");
  if (missing) { err.textContent = t("errFill"); err.style.display = "block"; return; }
  if (digits.length < 9 || digits.length > 15) { err.textContent = t("errPhone"); err.style.display = "block"; return; }
  err.style.display = "none";
  send({ t: "anketa", n: form.name.trim().slice(0, 60), ph: form.phone.trim().slice(0, 25), a: form.a });
});

/* ---------------- jobs ---------------- */
const JOB_VISA = { vollzeit: 4, teilzeit: 4, ausbildung: 5, saison: 8 };
let jobs = null, jq = "", jt = "all";
const openJobs = new Set();
async function loadJobs() {
  try {
    const r = await fetch("vakansiyalar.json?t=" + Date.now(), { cache: "no-store" });
    jobs = r.ok ? await r.json() : [];
  } catch (e) { jobs = []; }
  if (!Array.isArray(jobs)) jobs = [];
  jobs = jobs.filter(j => j && j.title).reverse();
  renderJobs();
}
function renderJobFilters() {
  const types = ["all", "vollzeit", "ausbildung", "saison", "teilzeit"];
  document.getElementById("job-filters").innerHTML = types.map(k => {
    const n = jobs ? (k === "all" ? jobs.length : jobs.filter(j => j.type === k).length) : "";
    return `<button class="chip ${jt === k ? "on" : ""}" data-jt="${k}">${esc(k === "all" ? t("all") : t("vt")[k])}${n !== "" ? " · " + n : ""}</button>`;
  }).join("");
}
function renderJobs() {
  document.getElementById("job-q").placeholder = t("jobSearch");
  renderJobFilters();
  const box = document.getElementById("job-list");
  if (jobs === null) { box.innerHTML = `<div class="empty">…</div>`; return; }
  if (!jobs.length) { box.innerHTML = `<div class="empty">${esc(t("jobEmpty"))}</div>`; return; }
  const q = jq.trim().toLowerCase();
  const list = jobs.filter(j => (jt === "all" || j.type === jt) &&
    (!q || [j.title, j.city, j.desc].join(" ").toLowerCase().includes(q)));
  if (!list.length) { box.innerHTML = `<div class="empty">${esc(t("jobNone"))}</div>`; return; }
  const LV = ["", "A1", "A2", "B1", "B2", "C1"];
  box.innerHTML = list.map(j => {
    const open = openJobs.has(j.id);
    const lv = LV[j.lang] ? `${t("jobLang")} ${LV[j.lang]}` : t("jobNoLang");
    return `<div class="card job ${open ? "open" : ""}" data-job="${j.id}">
      <div class="t">${esc(j.title)}</div>
      <div class="meta">
        <span class="tag t-${esc(j.type)}">${esc((t("vt")[j.type]) || j.type)}</span>
        ${j.city ? `<span class="tag">📍 ${esc(j.city)}</span>` : ""}
        <span class="tag">🗣 ${esc(lv)}</span>
      </div>
      ${j.salary ? `<div class="sal">💶 ${esc(j.salary)}</div>` : ""}
      ${j.date ? `<div class="date">${esc(j.date)}</div>` : ""}
      <div class="details">
        ${j.desc ? `<div class="desc">${esc(j.desc)}</div>` : ""}
        ${j.src ? `<div class="src">🔗 ${t("jobSrc")}: ${esc(j.src)}</div>` : ""}
        <div class="warnbox">${esc(t("jobWarn"))}</div>
        <button class="btn" data-jbook="${j.id}">${t("jobConsult")}</button>
      </div>
    </div>`;
  }).join("");
}
document.getElementById("job-q").addEventListener("input", (e) => { jq = e.target.value; renderJobs(); });
document.getElementById("job-filters").addEventListener("click", (e) => {
  const c = e.target.closest("[data-jt]"); if (!c) return;
  jt = c.dataset.jt; haptic(); renderJobs();
});
document.getElementById("job-list").addEventListener("click", (e) => {
  const b = e.target.closest("[data-jbook]");
  if (b) {
    const j = jobs.find(x => String(x.id) === b.dataset.jbook);
    if (j) send({ t: "book", v: JOB_VISA[j.type] ?? 4, vt: String(j.title).slice(0, 100) });
    return;
  }
  const card = e.target.closest("[data-job]"); if (!card) return;
  const id = +card.dataset.job;
  openJobs.has(id) ? openJobs.delete(id) : openJobs.add(id);
  haptic(); renderJobs();
});

/* ---------------- shell ---------------- */
function renderAll() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { const v = I[lang][el.dataset.i]; if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === "tab-" + tab));
  renderCatalog(); renderBall(); renderForm(); renderJobs();
}
document.querySelector(".langs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lang]"); if (!b) return;
  lang = b.dataset.lang; haptic(); renderAll();
});
document.querySelector("nav").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab; haptic(); renderAll(); window.scrollTo(0, 0);
});

if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
renderAll();
loadJobs();
</script>
